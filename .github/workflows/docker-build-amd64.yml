name: Build and Push Docker Image (x86_64 / AMD64)

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write

jobs:
  build-push-amd64:
    name: Build Docker AMD64 (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/bezbee25/woxxapp-web
          tags: |
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}-amd64
            type=raw,value={{date 'YYYYMMDD-HHmmss'}}
            type=sha,format=short,prefix=sha-,suffix=-amd64
            type=raw,value=latest-amd64,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push AMD64 Web App
        uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,mode=max,scope=amd64

      - name: Run Trivy vulnerability scanner on AMD64 image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/bezbee25/woxxapp-web:latest-amd64
          format: 'sarif'
          output: 'trivy-results-amd64.sarif'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results-amd64.sarif'
        continue-on-error: true
